<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Choices</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <h1>My Choices</h1>

        <table>
            <thead>
                <tr>
                    <th class="col-day">Day</th>
                    <th class="col-choices">Choices</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="col-day">
                        <div class="day-container">
                            <span id="current-day">Saturday</span>
                            <div class="checkbox-square"></div>
                        </div>
                    </td>
                    <td class="col-choices"></td>
                </tr>
        </table>
    </body>
</html>
